<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/ad-logo.png" />
    <link rel="preload" href="%sveltekit.assets%/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>try { const t = localStorage.getItem('marie.theme'); document.documentElement.dataset.theme = t || 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }</script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
